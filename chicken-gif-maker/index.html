<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>鸡公生成器</title>
<style>
:root{--ink:#17241e;--muted:#718078;--line:#dce5dd;--paper:#f5f7f1;--green:#315f42;--lime:#d8ed75;--orange:#f2a265;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans SC',sans-serif}.shell{max-width:1160px;margin:auto;padding:30px 32px 42px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:19px}.brand{display:flex;align-items:center;gap:12px}.brand-icon{width:36px;height:36px;border-radius:12px;background:var(--lime);display:grid;place-items:center;font-size:21px}.brand small,.mono{font:11px 'DM Mono',monospace;letter-spacing:.08em;color:var(--muted)}.brand h1{font-size:19px;margin:0;font-weight:800}.top .tag{border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:11px;color:var(--muted)}.intro{display:flex;justify-content:space-between;align-items:end;padding:32px 0 22px}.intro h2{font-size:26px;letter-spacing:-.04em;margin:0 0 7px}.intro p{margin:0;color:var(--muted);font-size:13px}.intro .steps{font:11px 'DM Mono',monospace;color:var(--muted)}.layout{display:grid;grid-template-columns:1fr 350px;gap:20px;align-items:start}.preview-card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px}.preview-card{padding:19px}.preview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.preview-head strong{font-size:13px}.live{font:10px 'DM Mono',monospace;color:#477254;display:flex;align-items:center;gap:6px}.live:before{content:'';width:6px;height:6px;border-radius:50%;background:#8abd6e}.stage{height:410px;border-radius:13px;background-color:#edf0e9;background-image:linear-gradient(45deg,#e3e8df 25%,transparent 25%),linear-gradient(-45deg,#e3e8df 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e3e8df 75%),linear-gradient(-45deg,transparent 75%,#e3e8df 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;display:grid;place-items:center;overflow:hidden;position:relative}#scene,#gifPreview{width:492px;height:336px;image-rendering:pixelated;image-rendering:crisp-edges;max-width:90%;max-height:90%;object-fit:contain}#scene{cursor:grab;touch-action:none}#scene:active{cursor:grabbing}#gifPreview{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%)}.preview-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;padding-top:13px}.panel{padding:17px}.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#f1f4ef;border-radius:10px;margin-bottom:17px}.tab{border:0;background:transparent;border-radius:7px;padding:9px;font:600 12px inherit;color:var(--muted);cursor:pointer}.tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px #1c36211a}.field{margin:0 0 16px}.field:last-child{margin-bottom:0}.labelrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.labelrow label{font-weight:700;font-size:12px}.labelrow span{font:10px 'DM Mono',monospace;color:var(--muted)}.upload{border:1px dashed #c7d4c8;border-radius:11px;padding:14px;background:#fbfcfa;display:block;cursor:pointer}.upload:hover{border-color:var(--green);background:#f7faf5}.upload b{font-size:12px}.upload small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.upload input{display:none}.mode{display:flex;gap:7px}.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 10px;color:var(--muted);font-size:11px;cursor:pointer}.chip.on{border-color:var(--green);color:var(--green);background:#eff6ee}.slider{width:100%;accent-color:var(--green);height:4px}.range-row{display:flex;justify-content:space-between;font:10px 'DM Mono',monospace;color:var(--muted);margin-top:4px}.textarea,input[type=text]{font:12px 'Noto Sans SC',sans-serif;width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--ink);outline:none}.textarea:focus,input[type=text]:focus{border-color:#72917b}.textarea{resize:vertical;min-height:74px}.toggleline{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600}.switch{appearance:none;width:34px;height:19px;border-radius:20px;background:#d6ddd5;position:relative;cursor:pointer;transition:.2s}.switch:after{content:'';position:absolute;left:3px;top:3px;width:13px;height:13px;border-radius:50%;background:white;transition:.2s}.switch:checked{background:var(--green)}.switch:checked:after{transform:translateX(15px)}.divider{height:1px;background:#edf0ec;margin:16px 0}.export{margin-top:15px;width:100%;border:0;border-radius:10px;background:var(--green);color:white;padding:13px;font:700 13px 'Noto Sans SC',sans-serif;cursor:pointer;display:flex;justify-content:center;gap:8px;align-items:center}.export:hover{background:#244c33}.export:disabled{opacity:.6;cursor:wait}.hint{text-align:center;font-size:10px;color:var(--muted);margin:9px 0 0}.hidden{display:none!important}.footnote{font-size:10px;color:#8a968d;line-height:1.7;margin-top:17px}.notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 15px;background:#182a20;color:white;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.notice.show{opacity:1}@media(max-width:800px){.shell{padding:20px 15px}.layout{grid-template-columns:1fr}.stage{height:310px}.intro{padding-top:24px}.intro h2{font-size:22px}.intro .steps{display:none}.panel{order:2}} 
</style>
</head>
<body><main class="shell">
<header class="top"><div class="brand"><div class="brand-icon">🐔</div><div><h1>鸡公生成器</h1><small>PARROT CHICKEN GIF MAKER</small></div></div></header>
<section class="intro"><div><p>上传一张图，或写一句话，马上做成循环 GIF。</p></div><span class="steps">01 上传　/　02 调整　/　03 保存</span></section>
<section class="layout"><div class="preview-card"><div class="preview-head"><strong>实时预览</strong><span class="live">LIVE PREVIEW</span></div><div class="stage"><canvas id="scene" width="82" height="56" aria-label="鹦鹉鸡表情预览"></canvas></div><div class="preview-foot"><span>拖动画布中的内容可调整位置</span><span>82 × 56 px · GIF 循环动画</span></div></div>
<aside class="panel"><div class="tabs"><button class="tab active" data-mode="image">图片模式</button><button class="tab" data-mode="sign">文字牌</button></div>
<div id="imageControls"><div class="field"><label class="upload"><div class="labelrow"><label>上传你的图片</label><span>PNG · JPG · GIF</span></div><b>＋　选择图片</b><small id="fileName">默认图片：ywj.png（点击可更换）</small><input id="fileInput" type="file" accept="image/*"></label></div><div class="field"><div class="toggleline"><label for="removeWhite">一键去白底</label><input class="switch" id="removeWhite" type="checkbox"></div></div></div>
<div id="signControls" class="hidden"><div class="field"><div class="labelrow"><label for="signText">牌子上的文字</label><span>最多 30 字</span></div><textarea id="signText" class="textarea" maxlength="30" placeholder="写点什么…">流浪星河</textarea></div><div class="field"><div class="labelrow"><label for="signLength">牌子长度</label><span id="lengthValue">74 px</span></div><input class="slider" id="signLength" type="range" min="34" max="76" value="74"><div class="range-row"><span>短</span><span>长</span></div></div></div>
<div class="divider"></div><div class="field"><div class="labelrow"><label>内容位置</label><span>可拖动预览调整</span></div><div class="labelrow"><label for="posX">水平</label><span id="xVal">4</span></div><input id="posX" class="slider" type="range" min="0" max="35" value="4"><div class="labelrow" style="margin-top:11px"><label for="posY">垂直</label><span id="yVal">22</span></div><input id="posY" class="slider" type="range" min="0" max="38" value="22"></div><div class="field" id="sizeField"><div class="labelrow"><label for="size">图片大小</label><span id="sizeVal">1.0×</span></div><input id="size" class="slider" type="range" min="60" max="250" value="100"></div><div class="field" id="rotateField"><div class="labelrow"><label for="rotation">旋转图片</label><span id="rotationVal">0°</span></div><input id="rotation" class="slider" type="range" min="-180" max="180" step="1" value="0"><div class="range-row"><span>−180°</span><span>180°</span></div></div>
<button class="export" id="exportBtn"><span>↓</span> 生成并下载 GIF</button><p class="hint">GIF 会自动循环播放　·　图片在本地处理</p><p class="footnote">去白底只会移除与图片边缘相连的白色背景；拖动预览里的内容可微调位置。</p></aside></section></main><div class="notice" id="notice"></div>
<script>
const W=82,H=56,canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const chickenFrames=[0,1,2,3].map(i=>{const im=new Image();im.src=`chicken-frames/frame${i}.png`;return im}),hand=new Image();hand.src='hand.png';
let mode='image',uploaded=null,sourceCanvas=null,sourceContext=null,objectUrl=null,drag=null,generatedBlob=null;
const $=s=>document.querySelector(s), controls={x:$('#posX'),y:$('#posY'),size:$('#size'),rotation:$('#rotation'),length:$('#signLength')};
function values(){return{x:+controls.x.value,y:+controls.y.value,scale:+controls.size.value/100,rotation:+controls.rotation.value,length:+controls.length.value}}
function markDirty(){generatedBlob=null;$('#exportBtn').classList.remove('hidden');$('#exportBtn').innerHTML='<span>↓</span> 生成并下载 GIF'}
function draw(frameIndex=Math.floor(performance.now()/100)%chickenFrames.length){if(!chickenFrames.every(im=>im.complete&&im.naturalWidth)&&chickenFrames.length)return;if(!hand.complete)return;ctx.clearRect(0,0,W,H);ctx.drawImage(chickenFrames[frameIndex],0,0,W,H);const v=values();if(mode==='image'&&sourceCanvas){let iw=sourceCanvas.width,ih=sourceCanvas.height;const maxW=48,maxH=27,k=Math.min(maxW/iw,maxH/ih)*v.scale;const w=iw*k,h=ih*k;ctx.save();ctx.translate(v.x+w/2,v.y+h/2);ctx.rotate(v.rotation*Math.PI/180);ctx.drawImage(sourceCanvas,-w/2,-h/2,w,h);ctx.restore()}else if(mode==='sign'){const x=v.x,y=v.y,w=v.length,h=19;ctx.fillStyle='#14547d';ctx.fillRect(x,y,w,h);ctx.fillStyle='#f7f8ef';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';const txt=$('#signText').value||'流浪星河';fitText(txt,x+3,y+2,w-6,h-4)}ctx.drawImage(hand,0,0,W,H)}
function fitText(text,x,y,w,h){const chars=[...text],lines=[];let line='';for(const ch of chars){if(ctx.measureText(line+ch).width>w&&line){lines.push(line);line=ch}else line+=ch}if(line)lines.push(line);let fs=Math.min(10,h/Math.max(1,lines.length)*.9);ctx.font=`bold ${fs}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';const lh=fs+1,yy=y+h/2-(lines.length-1)*lh/2;lines.slice(0,3).forEach((s,i)=>ctx.fillText(s,x+w/2,yy+i*lh,w))}
function loop(){draw();requestAnimationFrame(loop)}const readyTimer=setInterval(()=>{if(chickenFrames.every(im=>im.complete&&im.naturalWidth)&&hand.complete){clearInterval(readyTimer);requestAnimationFrame(loop)}},20);hand.onload=draw;
function setSourceImage(im,label){uploaded=im;sourceCanvas=document.createElement('canvas');sourceCanvas.width=im.naturalWidth;sourceCanvas.height=im.naturalHeight;sourceContext=sourceCanvas.getContext('2d',{willReadFrequently:true});sourceContext.drawImage(im,0,0);$('#fileName').textContent=label;if($('#removeWhite').checked)applyWhite();else draw()}
$('#fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;markDirty();if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);const im=new Image();im.onload=()=>setSourceImage(im,f.name);im.src=objectUrl});
function applyWhite(){if(!uploaded||!sourceCanvas)return;sourceContext.clearRect(0,0,sourceCanvas.width,sourceCanvas.height);sourceContext.drawImage(uploaded,0,0);if($('#removeWhite').checked){const image=sourceContext.getImageData(0,0,sourceCanvas.width,sourceCanvas.height),p=image.data,w=sourceCanvas.width,h=sourceCanvas.height,n=w*h,visited=new Uint8Array(n),queue=new Uint32Array(n);let head=0,tail=0;const isWhite=i=>{const k=i*4;return p[k+3]>0&&p[k]>=220&&p[k+1]>=220&&p[k+2]>=220};const add=i=>{if(!visited[i]&&isWhite(i)){visited[i]=1;queue[tail++]=i}};for(let x=0;x<w;x++){add(x);add((h-1)*w+x)}for(let y=0;y<h;y++){add(y*w);add(y*w+w-1)}while(head<tail){const i=queue[head++],x=i%w,y=(i/w)|0;if(x)add(i-1);if(x+1<w)add(i+1);if(y)add(i-w);if(y+1<h)add(i+w);if(x&&y)add(i-w-1);if(x+1<w&&y)add(i-w+1);if(x&&y+1<h)add(i+w-1);if(x+1<w&&y+1<h)add(i+w+1)}for(let q=0;q<tail;q++){const k=queue[q]*4,light=Math.min(p[k],p[k+1],p[k+2]),coverage=Math.max(0,Math.min(1,(255-light)/35));p[k+3]=Math.round(p[k+3]*coverage)}sourceContext.putImageData(image,0,0)}draw()}
const defaultPhoto=new Image();defaultPhoto.onload=()=>setSourceImage(defaultPhoto,'默认图片：ywj.png（点击可更换）');defaultPhoto.src='ywj.png';
$('#removeWhite').addEventListener('change',()=>{markDirty();applyWhite()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{markDirty();mode=b.dataset.mode;if(mode==='sign'){controls.y.value=33;$('#yVal').textContent='33'}else{controls.y.value=22;$('#yVal').textContent='22'}document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('#imageControls').classList.toggle('hidden',mode!=='image');$('#signControls').classList.toggle('hidden',mode!=='sign');$('#sizeField').classList.toggle('hidden',mode==='sign');$('#rotateField').classList.toggle('hidden',mode==='sign');draw()});
controls.x.oninput=()=>{markDirty();$('#xVal').textContent=controls.x.value;draw()};controls.y.oninput=()=>{markDirty();$('#yVal').textContent=controls.y.value;draw()};controls.size.oninput=()=>{markDirty();$('#sizeVal').textContent=(controls.size.value/100).toFixed(1)+'×';draw()};controls.rotation.oninput=()=>{markDirty();$('#rotationVal').textContent=controls.rotation.value+'°';draw()};controls.length.oninput=()=>{markDirty();$('#lengthValue').textContent=controls.length.value+' px';draw()};$('#signText').oninput=()=>{markDirty();draw()};
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),v=values();drag={x:(e.clientX-r.left)*W/r.width-v.x,y:(e.clientY-r.top)*H/r.height-v.y};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;const r=canvas.getBoundingClientRect();controls.x.value=Math.max(0,Math.min(35,Math.round((e.clientX-r.left)*W/r.width-drag.x)));controls.y.value=Math.max(0,Math.min(38,Math.round((e.clientY-r.top)*H/r.height-drag.y)));$('#xVal').textContent=controls.x.value;$('#yVal').textContent=controls.y.value;draw()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
function bytes(arr){return new Uint8Array(arr)}
function encodeGIF(frames,w,h,delay){const out=[];const str=s=>{for(let i=0;i<s.length;i++)out.push(s.charCodeAt(i))};const u16=n=>{out.push(n&255,(n>>8)&255)};str('GIF89a');u16(w);u16(h);out.push(0xf7,0,0);out.push(0,0,0);for(let i=0;i<255;i++)out.push((i>>5&7)*255/7|0,(i>>2&7)*255/7|0,(i&3)*255/3|0);out.push(0x21,0xff,0x0b);str('NETSCAPE2.0');out.push(3,1,0,0,0);for(const pix of frames){out.push(0x21,0xf9,4,0x09);u16(delay);out.push(0,0,0x2c);u16(0);u16(0);u16(w);u16(h);out.push(0);out.push(8);const clear=256,end=257,data=[];let bits=0,nb=0,count=0;const put=c=>{bits|=c<<nb;nb+=9;while(nb>=8){data.push(bits&255);bits>>>=8;nb-=8}};put(clear);for(const px of pix){put(px);if(++count===200){put(clear);count=0}}put(end);if(nb)data.push(bits&255);for(let i=0;i<data.length;i+=255){const n=Math.min(255,data.length-i);out.push(n,...data.slice(i,i+n))}out.push(0)}str(';');return new Blob([bytes(out)],{type:'image/gif'})}
function quantize(imageData){const d=imageData.data,a=new Uint8Array(W*H);for(let i=0,j=0;i<d.length;i+=4,j++){a[j]=d[i+3]<128?0:Math.min(255,1+((d[i]>>5)<<5|((d[i+1]>>5)<<2)|(d[i+2]>>6)))}return a}
$('#exportBtn').onclick=async()=>{if(!chickenFrames.every(im=>im.complete&&im.naturalWidth)){toast('底图还在加载，请稍候');return}const btn=$('#exportBtn');btn.disabled=true;btn.textContent='正在生成 GIF…';try{const frames=[];for(let i=0;i<chickenFrames.length;i++){draw(i);frames.push(quantize(ctx.getImageData(0,0,W,H)))}generatedBlob=encodeGIF(frames,W,H,10);const url=URL.createObjectURL(generatedBlob),a=document.createElement('a');a.href=url;a.download='鸡公生成器.gif';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('循环 GIF 已下载')}catch(err){console.error(err);toast('生成失败，请重试')}finally{btn.disabled=false;btn.innerHTML='<span>↓</span> 生成并下载 GIF'}};
function toast(s){const el=$('#notice');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
</script></body></html>
