<body><main class="shell">
<header class="top"><div class="brand"><div class="brand-icon">🐔</div><div><h1>鸡公生成器</h1><small>PARROT CHICKEN GIF MAKER</small></div></div></header>
<section class="intro"><div><p>让鸡鸡草草你的表情包！</p></div><span class="steps">01 上传　/　02 调整　/　03 保存</span></section>
<section class="layout"><div class="preview-card"><div class="preview-head"><strong>实时预览</strong><span class="live">LIVE PREVIEW</span></div><div class="stage"><canvas id="scene" width="82" height="56" aria-label="鹦鹉鸡表情预览"></canvas></div><div class="preview-foot"><span>拖动画布中的内容可调整位置</span><span>82 × 56 px · GIF 循环动画</span></div></div>
<aside class="panel"><div class="tabs"><button class="tab active" data-mode="image">图片模式</button><button class="tab" data-mode="sign">文字牌</button></div>
<div id="imageControls"><div class="field"><label class="upload"><div class="labelrow"><label>上传你的图片</label><span>GIF / WebP 动图</span></div><b>＋　选择图片</b><small id="fileName">默认图片：ywj.png（点击可更换）</small><input id="fileInput" type="file" accept="image/*"></label></div><div class="field toggle-pair"><div class="toggleline"><label for="removeWhite">一键去白底</label><input class="switch" id="removeWhite" type="checkbox"></div><div class="toggleline"><label for="flipImage">水平翻转</label><input class="switch" id="flipImage" type="checkbox"></div></div></div>
<div id="signControls" class="hidden"><div class="field"><div class="labelrow"><label for="signText">牌子上的文字</label><span>最多 30 字</span></div><textarea id="signText" class="textarea" maxlength="30" placeholder="写点什么…">流浪星河</textarea></div><div class="field"><div class="labelrow"><label for="signLength">牌子长度</label><span id="lengthValue">74 px</span></div><input class="slider" id="signLength" type="range" min="34" max="76" value="74"><div class="range-row"><span>短</span><span>长</span></div></div></div>
<div class="divider"></div><div class="field"><div class="labelrow"><label>内容位置</label><span>可拖动预览调整</span></div><div class="labelrow"><label for="posX">水平</label><span id="xVal">4</span></div><input id="posX" class="slider" type="range" min="0" max="35" value="4"><div class="labelrow" style="margin-top:11px"><label for="posY">垂直</label><span id="yVal">22</span></div><input id="posY" class="slider" type="range" min="0" max="38" value="22"></div><div class="field" id="sizeField"><div class="labelrow"><label for="size">图片大小</label><span id="sizeVal">1.0×</span></div><input id="size" class="slider" type="range" min="60" max="250" value="100"></div><div class="field" id="rotateField"><div class="labelrow"><label for="rotation">旋转图片</label><span id="rotationVal">0°</span></div><input id="rotation" class="slider" type="range" min="-180" max="180" step="1" value="0"><div class="range-row"><span>−180°</span><span>180°</span></div></div>
<div class="field"><div class="toggleline"><label for="shakeChicken">鹦鹉鸡震动模式</label><input class="switch" id="shakeChicken" type="checkbox"></div></div><div class="field"><div class="toggleline"><label for="shakeImage">自定义图片震动模式</label><input class="switch" id="shakeImage" type="checkbox"></div></div><button class="export" id="exportBtn"><span>↓</span> 生成并下载 GIF</button><p class="hint">GIF 会自动循环播放　·　图片在本地处理</p><p class="footnote">去白底只会移除与图片边缘相连的白色背景；拖动预览里的内容可微调位置。</p></aside></section></main><div class="notice" id="notice"></div>
<script>
const W=82,H=56,canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const chickenFrames=[0,1,2,3].map(i=>{const im=new Image();im.src=`chicken-frames/frame${i}.png`;return im}),hand=new Image();hand.src='hand.png';
let mode='image',uploaded=null,sourceCanvas=null,sourceContext=null,objectUrl=null,drag=null,generatedBlob=null,animatedUpload=false,uploadedCycle=400,lastSourceFrame=0,animatedFrames=null,animatedDurations=[],animationStartedAt=0,animatedCycle=400;
const $=s=>document.querySelector(s), controls={x:$('#posX'),y:$('#posY'),size:$('#size'),rotation:$('#rotation'),length:$('#signLength')};
function values(){return{x:+controls.x.value,y:+controls.y.value,scale:+controls.size.value/100,rotation:+controls.rotation.value,length:+controls.length.value}}
function markDirty(){generatedBlob=null;$('#exportBtn').classList.remove('hidden');$('#exportBtn').innerHTML='<span>↓</span> 生成并下载 GIF'}
function chickenShake(time){if(!$('#shakeChicken').checked)return{x:0,y:0,angle:0};const phase=time*Math.PI/125;return{x:Math.sin(phase)*.55,y:Math.sin(phase+1.15)*.45,angle:Math.sin(phase+2.1)*.012}}
function customImageShake(time){if(mode!=='image'||!$('#shakeImage').checked)return{x:0,y:0,angle:0};const phase=time*Math.PI/125;return{x:Math.sin(phase+.6)*.42,y:Math.sin(phase+1.7)*.36,angle:Math.sin(phase+2.4)*.009}}
function drawChickenLayer(image,shake){ctx.save();ctx.translate(W/2+shake.x,H/2+shake.y);ctx.rotate(shake.angle);ctx.translate(-W/2,-H/2);ctx.drawImage(image,0,0,W,H);ctx.restore()}
function draw(frameIndex=Math.floor(performance.now()/100)%chickenFrames.length,forceSourceFrame=false,sourceTime=performance.now()){if(!chickenFrames.every(im=>im.complete&&im.naturalWidth)&&chickenFrames.length)return;if(!hand.complete)return;ctx.clearRect(0,0,W,H);const shake=chickenShake(sourceTime);drawChickenLayer(chickenFrames[frameIndex%chickenFrames.length],shake);const v=values();if(mode==='image'&&sourceCanvas){if(animatedUpload)refreshSourceFrame(forceSourceFrame,sourceTime);let iw=sourceCanvas.width,ih=sourceCanvas.height;const maxW=48,maxH=27,k=Math.min(maxW/iw,maxH/ih)*v.scale;const w=iw*k,h=ih*k;const pictureShake=customImageShake(sourceTime);ctx.save();ctx.translate(v.x+w/2+pictureShake.x,v.y+h/2+pictureShake.y);ctx.rotate(v.rotation*Math.PI/180+pictureShake.angle);ctx.scale($('#flipImage').checked?-1:1,1);ctx.drawImage(sourceCanvas,-w/2,-h/2,w,h);ctx.restore()}else if(mode==='sign'){const x=v.x,y=v.y,w=v.length,h=19;ctx.fillStyle='#14547d';ctx.fillRect(x,y,w,h);ctx.fillStyle='#f7f8ef';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';const txt=$('#signText').value||'流浪星河';fitText(txt,x+3,y+2,w-6,h-4)}drawChickenLayer(hand,shake)}
function fitText(text,x,y,w,h){const chars=[...text],lines=[];let line='';for(const ch of chars){if(ctx.measureText(line+ch).width>w&&line){lines.push(line);line=ch}else line+=ch}if(line)lines.push(line);let fs=Math.min(10,h/Math.max(1,lines.length)*.9);ctx.font=`bold ${fs}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';const lh=fs+1,yy=y+h/2-(lines.length-1)*lh/2;lines.slice(0,3).forEach((s,i)=>ctx.fillText(s,x+w/2,yy+i*lh,w))}
function loop(){draw();requestAnimationFrame(loop)}const readyTimer=setInterval(()=>{if(chickenFrames.every(im=>im.complete&&im.naturalWidth)&&hand.complete){clearInterval(readyTimer);requestAnimationFrame(loop)}},20);hand.onload=draw;
function setSourceImage(im,label,isAnimated=false,decodedFrames=null,durations=[]){if(uploaded&&uploaded!==im)uploaded.remove();uploaded=im;animatedUpload=isAnimated;animatedFrames=decodedFrames;animatedDurations=durations;animatedCycle=durations.reduce((a,b)=>a+b,0)||400;animationStartedAt=performance.now();lastSourceFrame=0;if(isAnimated&&!decodedFrames){im.classList.add('animated-source-driver');im.setAttribute('aria-hidden','true');if(!im.isConnected)document.body.appendChild(im)}else{im.remove()}const scale=decodedFrames?1:Math.min(1,256/Math.max(im.naturalWidth,im.naturalHeight));sourceCanvas=document.createElement('canvas');sourceCanvas.width=decodedFrames?decodedFrames[0].width:Math.max(1,Math.round(im.naturalWidth*scale));sourceCanvas.height=decodedFrames?decodedFrames[0].height:Math.max(1,Math.round(im.naturalHeight*scale));sourceContext=sourceCanvas.getContext('2d',{willReadFrequently:true});$('#fileName').textContent=label;refreshSourceFrame(true);draw()}
function removeOuterWhite(){const image=sourceContext.getImageData(0,0,sourceCanvas.width,sourceCanvas.height),p=image.data,w=sourceCanvas.width,h=sourceCanvas.height,n=w*h,visited=new Uint8Array(n),queue=new Uint32Array(n);let head=0,tail=0;const isWhite=i=>{const k=i*4;return p[k+3]>0&&p[k]>=220&&p[k+1]>=220&&p[k+2]>=220};const add=i=>{if(!visited[i]&&isWhite(i)){visited[i]=1;queue[tail++]=i}};for(let x=0;x<w;x++){add(x);add((h-1)*w+x)}for(let y=0;y<h;y++){add(y*w);add(y*w+w-1)}while(head<tail){const i=queue[head++],x=i%w,y=(i/w)|0;if(x)add(i-1);if(x+1<w)add(i+1);if(y)add(i-w);if(y+1<h)add(i+w);if(x&&y)add(i-w-1);if(x+1<w&&y)add(i-w+1);if(x&&y+1<h)add(i+w-1);if(x+1<w&&y+1<h)add(i+w+1)}for(let q=0;q<tail;q++){const k=queue[q]*4,light=Math.min(p[k],p[k+1],p[k+2]),coverage=Math.max(0,Math.min(1,(255-light)/35));p[k+3]=Math.round(p[k+3]*coverage)}sourceContext.putImageData(image,0,0)}
function refreshSourceFrame(force=false,time=performance.now()){if(!uploaded||!sourceContext)return;if(!force&&time-lastSourceFrame<50)return;sourceContext.clearRect(0,0,sourceCanvas.width,sourceCanvas.height);let source=uploaded;if(animatedFrames&&animatedDurations.length){let elapsed=((time-animationStartedAt)%animatedCycle+animatedCycle)%animatedCycle,index=0;while(index<animatedDurations.length-1&&elapsed>=animatedDurations[index]){elapsed-=animatedDurations[index];index++}source=animatedFrames[index]}sourceContext.drawImage(source,0,0,sourceCanvas.width,sourceCanvas.height);if($('#removeWhite').checked)removeOuterWhite();lastSourceFrame=time}
function applyWhite(){refreshSourceFrame(true);draw()}
async function getGifCycle(file){if(!/gif/i.test(file.type)&&!file.name.toLowerCase().endsWith('.gif'))return 2000;const b=new Uint8Array(await file.arrayBuffer());if(b.length<13)return 400;let p=13;if(b[10]&128)p+=3*(1<<((b[10]&7)+1));let delay=100,total=0,count=0;const skipBlocks=pos=>{while(pos<b.length&&b[pos])pos+=1+b[pos];return pos+1};while(p<b.length){const type=b[p++];if(type===0x3b)break;if(type===0x21){const label=b[p++];if(label===0xf9){const size=b[p++];if(size>=4){const d=b[p+1]|(b[p+2]<<8);delay=d?d*10:100}p+=size;if(b[p]===0)p++}else p=skipBlocks(p);continue}if(type===0x2c){p+=8;const packed=b[p++];if(packed&128)p+=3*(1<<((packed&7)+1));p++;p=skipBlocks(p);count++;total+=delay;delay=100;continue}break}return count>1?Math.max(100,total):400}
async function decodeAnimation(file){if(!('ImageDecoder'in window)||!file.type)return null;let decoder;try{if(!await ImageDecoder.isTypeSupported(file.type))return null;decoder=new ImageDecoder({data:await file.arrayBuffer(),type:file.type,preferAnimation:true});await decoder.tracks.ready;const track=decoder.tracks.selectedTrack;if(!track||!track.animated||track.frameCount<2){decoder.close();return null}const frames=[],durations=[],stride=Math.max(1,Math.ceil(track.frameCount/240));let scale=1,pendingDuration=0;for(let i=0;i<track.frameCount;i++){const{image}=await decoder.decode({frameIndex:i});if(i===0)scale=Math.min(1,256/Math.max(image.displayWidth,image.displayHeight));pendingDuration+=Math.max(20,Math.round((image.duration||100000)/10000)*10);if((i+1)%stride===0||i===track.frameCount-1){const frame=document.createElement('canvas');frame.width=Math.max(1,Math.round(image.displayWidth*scale));frame.height=Math.max(1,Math.round(image.displayHeight*scale));frame.getContext('2d').drawImage(image,0,0,frame.width,frame.height);frames.push(frame);durations.push(pendingDuration);pendingDuration=0}image.close()}decoder.close();return{frames,durations,cycle:durations.reduce((a,b)=>a+b,0)}}catch(err){console.warn('动画解码回退到浏览器图片播放',err);try{decoder?.close()}catch{}return null}}
$('#fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;markDirty();if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);const im=new Image();im.onload=async()=>{const isAnimated=/image\/(gif|webp|apng)/i.test(f.type)||/\.(gif|webp|apng)$/i.test(f.name);const decoded=isAnimated?await decodeAnimation(f):null;animatedUpload=isAnimated;uploadedCycle=decoded?.cycle||(isAnimated?await getGifCycle(f):400);setSourceImage(im,f.name,isAnimated,decoded?.frames||null,decoded?.durations||[])};im.src=objectUrl});
const defaultPhoto=new Image();defaultPhoto.onload=()=>setSourceImage(defaultPhoto,'默认图片：ywj.png（点击可更换）');defaultPhoto.src='ywj.png';
$('#removeWhite').addEventListener('change',()=>{markDirty();applyWhite()});$('#flipImage').addEventListener('change',()=>{markDirty();draw()});$('#shakeChicken').addEventListener('change',()=>{markDirty();draw()});$('#shakeImage').addEventListener('change',()=>{markDirty();draw()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{markDirty();mode=b.dataset.mode;if(mode==='sign'){controls.y.value=33;$('#yVal').textContent='33'}else{controls.y.value=22;$('#yVal').textContent='22'}document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('#imageControls').classList.toggle('hidden',mode!=='image');$('#signControls').classList.toggle('hidden',mode!=='sign');$('#sizeField').classList.toggle('hidden',mode==='sign');$('#rotateField').classList.toggle('hidden',mode==='sign');draw()});
controls.x.oninput=()=>{markDirty();$('#xVal').textContent=controls.x.value;draw()};controls.y.oninput=()=>{markDirty();$('#yVal').textContent=controls.y.value;draw()};controls.size.oninput=()=>{markDirty();$('#sizeVal').textContent=(controls.size.value/100).toFixed(1)+'×';draw()};controls.rotation.oninput=()=>{markDirty();$('#rotationVal').textContent=controls.rotation.value+'°';draw()};controls.length.oninput=()=>{markDirty();$('#lengthValue').textContent=controls.length.value+' px';draw()};$('#signText').oninput=()=>{markDirty();draw()};
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),v=values();drag={x:(e.clientX-r.left)*W/r.width-v.x,y:(e.clientY-r.top)*H/r.height-v.y};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;const r=canvas.getBoundingClientRect();controls.x.value=Math.max(0,Math.min(35,Math.round((e.clientX-r.left)*W/r.width-drag.x)));controls.y.value=Math.max(0,Math.min(38,Math.round((e.clientY-r.top)*H/r.height-drag.y)));$('#xVal').textContent=controls.x.value;$('#yVal').textContent=controls.y.value;draw()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
function bytes(arr){return new Uint8Array(arr)}
function makePalette(images){const histogram=new Map();for(const image of images){const d=image.data;for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;const key=(d[i]<<16)|(d[i+1]<<8)|d[i+2];histogram.set(key,(histogram.get(key)||0)+1)}}let boxes=[Array.from(histogram,([key,count])=>({r:key>>16,g:key>>8&255,b:key&255,count}))];while(boxes.length<255){let chosen=-1,best=-1,axis=0;for(let i=0;i<boxes.length;i++){const pts=boxes[i];if(pts.length<2)continue;let lo=[255,255,255],hi=[0,0,0],weight=0;for(const p of pts){const v=[p.r,p.g,p.b];for(let c=0;c<3;c++){lo[c]=Math.min(lo[c],v[c]);hi[c]=Math.max(hi[c],v[c])}weight+=p.count}const ranges=hi.map((v,c)=>v-lo[c]),channel=ranges.indexOf(Math.max(...ranges)),score=ranges[channel]*weight;if(score>best){best=score;chosen=i;axis=channel}}if(chosen<0)break;const pts=boxes[chosen];pts.sort((a,b)=>(axis===0?a.r-b.r:axis===1?a.g-b.g:a.b-b.b));const total=pts.reduce((s,p)=>s+p.count,0);let acc=0,cut=1;for(;cut<pts.length;cut++){acc+=pts[cut-1].count;if(acc>=total/2)break}boxes.splice(chosen,1,pts.slice(0,cut),pts.slice(cut))}const colors=boxes.map(pts=>{let r=0,g=0,b=0,n=0;for(const p of pts){r+=p.r*p.count;g+=p.g*p.count;b+=p.b*p.count;n+=p.count}return[Math.round(r/n),Math.round(g/n),Math.round(b/n)]});while(colors.length<255)colors.push(colors[colors.length-1]||[0,0,0]);const map=new Map(),indexed=images.map(image=>{const d=image.data,out=new Uint8Array(W*H);for(let i=0,j=0;i<d.length;i+=4,j++){if(d[i+3]<128){out[j]=0;continue}const key=(d[i]<<16)|(d[i+1]<<8)|d[i+2];let idx=map.get(key);if(idx===undefined){let best=Infinity;idx=1;for(let k=0;k<colors.length;k++){const c=colors[k],dr=d[i]-c[0],dg=d[i+1]-c[1],db=d[i+2]-c[2],dist=dr*dr*.30+dg*dg*.59+db*db*.11;if(dist<best){best=dist;idx=k+1}}map.set(key,idx)}out[j]=idx}return out});return{colors,indexed}}
function encodeGIF(images,w,h,delay){const{colors,indexed:frames}=makePalette(images),out=[];const str=s=>{for(let i=0;i<s.length;i++)out.push(s.charCodeAt(i))};const u16=n=>{out.push(n&255,(n>>8)&255)};str('GIF89a');u16(w);u16(h);out.push(0xf7,0,0);out.push(0,0,0);for(const c of colors)out.push(...c);out.push(0x21,0xff,0x0b);str('NETSCAPE2.0');out.push(3,1,0,0,0);for(const pix of frames){out.push(0x21,0xf9,4,0x09);u16(delay);out.push(0,0,0x2c);u16(0);u16(0);u16(w);u16(h);out.push(0);out.push(8);const clear=256,end=257,data=[];let bits=0,nb=0,count=0;const put=c=>{bits|=c<<nb;nb+=9;while(nb>=8){data.push(bits&255);bits>>>=8;nb-=8}};put(clear);for(const px of pix){put(px);if(++count===200){put(clear);count=0}}put(end);if(nb)data.push(bits&255);for(let i=0;i<data.length;i+=255){const n=Math.min(255,data.length-i);out.push(n,...data.slice(i,i+n))}out.push(0)}str(';');return new Blob([bytes(out)],{type:'image/gif'})}
const gcd=(a,b)=>b?gcd(b,a%b):a,lcm=(a,b)=>a/gcd(a,b)*b;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
$('#exportBtn').onclick=async()=>{if(!chickenFrames.every(im=>im.complete&&im.naturalWidth)){toast('鸡鸡还在加载，请稍候');return}const btn=$('#exportBtn'),includeUploadedAnimation=mode==='image'&&animatedUpload;btn.disabled=true;btn.textContent='正在生成 GIF…';try{const frames=[],baseCycle=chickenFrames.length*100,contentCycle=includeUploadedAnimation?lcm(baseCycle,uploadedCycle):baseCycle,shakeEnabled=$('#shakeChicken').checked||(mode==='image'&&$('#shakeImage').checked),cycle=shakeEnabled?lcm(contentCycle,250):contentCycle;let frameCount=Math.min(240,Math.floor(cycle/50));while(frameCount>1&&(cycle%frameCount!==0||(cycle/frameCount)%10!==0))frameCount--;const step=cycle/frameCount;for(let i=0;i<frameCount;i++){await wait(step);draw(Math.floor(i*step/100)%chickenFrames.length,true,performance.now());frames.push(ctx.getImageData(0,0,W,H))}generatedBlob=encodeGIF(frames,W,H,step/10);const url=URL.createObjectURL(generatedBlob),a=document.createElement('a');a.href=url;a.download='鸡公生成器.gif';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast(includeUploadedAnimation?'草了！!':'草了！!')}catch(err){console.error(err);toast('生成失败，请重试')}finally{btn.disabled=false;btn.innerHTML='<span>↓</span> 生成并下载 GIF'}};
function toast(s){const el=$('#notice');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
